<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KRAKESMP | OWNER PANEL</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>👑 KRAKESMP</h1>
  <p>OWNER MANAGEMENT PANEL</p>
  <div class="small">PRIVATE ADMIN AREA</div>
</header>

<main>

  <!-- OWNER LOGIN -->
  <section class="card" id="loginPanel">

    <h2>🔐 OWNER LOGIN</h2>

    <input
      id="email"
      type="email"
      placeholder="Owner E-Mail"
    >

    <input
      id="password"
      type="password"
      placeholder="Owner Passwort"
    >

    <button onclick="adminLogin()">
      👑 EINLOGGEN
    </button>

    <button
      class="secondary"
      onclick="location.href='index.html'">
      ZURÜCK ZUM LEADERBOARD
    </button>

  </section>


  <!-- ADMIN PANEL -->
  <section
    class="card"
    id="adminPanel"
    style="display:none"
  >

    <h2>👑 OWNER DASHBOARD</h2>

    <p class="green" id="status">
      OWNER AKTIV
    </p>

    <hr>

    <!-- ÜBERSICHT -->
    <h2>📊 STATISTIKEN</h2>

    <div class="stats">

      <div class="stat">
        Spieler
        <b id="playerCount">0</b>
      </div>

      <div class="stat">
        Gesamtumsatz
        <b id="totalTurnover">0 Coins</b>
      </div>

    </div>

    <hr>

    <!-- SPIELER -->
    <h2>👥 SPIELERVERWALTUNG</h2>

    <div id="players">
      Spieler werden geladen...
    </div>

    <hr>

    <!-- STATISTIK EINTRAGEN -->
    <h2>➕ STATISTIK EINTRAGEN</h2>

    <label>Spieler auswählen</label>

    <select id="roundUser">
      <option value="">Spieler auswählen...</option>
    </select>

    <label>Spielname / Event</label>

    <input
      id="gameName"
      type="text"
      placeholder="z.B. PvP Event"
    >

    <label>Einsatz</label>

    <input
      id="stake"
      type="number"
      min="0"
      placeholder="z.B. 500"
    >

    <label>Profit / Verlust</label>

    <input
      id="result"
      type="number"
      placeholder="z.B. 250 oder -100"
    >

    <label>Ergebnis</label>

    <select id="won">

      <option value="true">
        Gewonnen
      </option>

      <option value="false">
        Verloren
      </option>

    </select>

    <button
      id="saveRoundButton"
      onclick="saveRound()"
    >
      STATISTIK SPEICHERN
    </button>

    <button
      class="secondary"
      onclick="resetRoundForm()"
    >
      FORMULAR ZURÜCKSETZEN
    </button>

    <hr>

    <!-- LETZTE EINTRÄGE -->
    <h2>📜 STATISTIKVERLAUF</h2>

    <div id="roundList">
      Noch keine Einträge.
    </div>

    <hr>

    <!-- NAVIGATION -->
    <button
      class="secondary"
      onclick="loadAdminData()"
    >
      🔄 DATEN AKTUALISIEREN
    </button>

    <button
      class="secondary"
      onclick="location.href='index.html'"
    >
      ZURÜCK ZUM LEADERBOARD
    </button>

    <button
      class="danger"
      onclick="adminLogout()"
    >
      ABMELDEN
    </button>

  </section>

</main>

<footer>
  KRAKESMP · OWNER MANAGEMENT
</footer>

<script src="app.js"></script>
<script src="admin.js"></script>

</body>
</html>
